{% extends 'base.html' %}

{% block title %}Create Post{% endblock %}

{% block content %}

<h1>Create a Post</h1>

<form method="POST">
    {% csrf_token %}

    <textarea
        name="content"
        rows="5"
        cols="50"
        placeholder="What's on your mind?"
        required
    ></textarea>

    <br><br>

    <button type="submit">Post</button>
</form>

{% endblock %}
